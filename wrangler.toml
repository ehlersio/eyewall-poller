name = "eyewall-poller"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

account_id = "178d2c4244e085446f83db4137cf8ff7"

# Scheduled trigger — polls NHL API every 60s during the season.
# Disabled in offseason by commenting out or setting a low-frequency cron.
[triggers]
crons = ["* * * * *"]

# Observability — enables real-time logs and traces in Cloudflare dashboard
[observability]
enabled = true

# KV namespace binding
[[kv_namespaces]]
binding = "CACHE"
id      = "08c4ef455c584c83a811a96aa3c620ed"

# AI binding
[ai]
binding = "AI"

# Rate limiting binding — guards the billed AI-calling routes
# (/prediction/analyze, /summary/narrative, /pwhl/summary/narrative,
# /pwhl/scout) from unbounded public-cost abuse. These routes are called
# directly from the public frontend, so a shared-secret check (as used by
# the ingest/mutating routes below) wouldn't work — the secret would ship
# in browser JS. This is a Workers-native platform feature (not a
# dashboard/WAF rule), works on any Workers plan, and is provisioned
# automatically at deploy time from this config — no separate dashboard
# setup needed. namespace_id is an arbitrary small integer scoping this
# binding's buckets; it doesn't need to be pre-created anywhere.
[[ratelimits]]
name         = "AI_ROUTE_LIMITER"
namespace_id = "1001"
simple       = { limit = 10, period = 60 }

# Secrets (set via `wrangler secret put <NAME>` — never commit values here):
#   POLL_SECRET
#   VAPID_PUBLIC_KEY
#   VAPID_PRIVATE_KEY
#   VAPID_SUBJECT
#   NHL_SEASON        — e.g. "20252026" (flip each October)
#
# View current secrets: wrangler secret list
# Set a secret:        wrangler secret put POLL_SECRET
